<style>
:root{--bg:#f6f1e9;--card:#fffdf9;--ink:#3b332c;--muted:#8a7d70;--sage:#7d8f72;--sage-l:#e7ecdf;--clay:#c07a55;--line:#e6ddd0;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 120px}
h1,h2,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
h1{font-size:34px;line-height:1.1;margin:10px 0}
h2{font-size:28px;line-height:1.15;margin:4px 0 6px}
.lead{color:var(--muted)}
.prog{position:sticky;top:0;background:var(--bg);padding:12px 0 10px;z-index:3}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sage);width:0;transition:width .3s}
.prog .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:14px 0}
.q .t{font-weight:700;margin-bottom:2px}
.q .h{font-size:13px;color:var(--muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px}
.chip.on{background:var(--sage-l);border-color:var(--sage);color:#2f3a29;font-weight:700}
.chip.ai{border-style:dashed}
.chip .sw{width:16px;height:16px;border-radius:50%;border:1px solid #0002}
.vibes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vibe{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;font:inherit;color:var(--ink);padding:0}
.vibe.on{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-l)}
.vibe .pal{display:flex;height:46px}.vibe .pal span{flex:1}
.vibe b{display:block;padding:8px 10px 0;font-size:14px}
.vibe small{display:block;padding:0 10px 10px;color:var(--muted);font-size:12px}
input[type=text],textarea,input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.other{margin-top:10px;display:none}.other.on{display:block}
.nav{position:fixed;left:0;right:0;bottom:0;background:#f6f1e9f2;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(6px)}
.nav .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
button.b{border:0;border-radius:12px;padding:14px 18px;font:700 16px "Nunito Sans",sans-serif;cursor:pointer}
.b.pri{background:var(--sage);color:#fff;flex:1}
.b.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.b.clay{background:var(--clay);color:#fff}
.note{background:var(--sage-l);border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
.warn{background:#f7e6dc;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:4px}
td{padding:4px;vertical-align:top}
td input{padding:8px;border-radius:8px;font-size:14px}
.x{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:6px}
.saved{font-size:12px;color:var(--muted)}
.sec-list button{display:flex;justify-content:space-between;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer}
.ok{color:var(--sage);font-weight:700}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,monospace;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:340px;overflow:auto}
</style>
</head>

// ===== State =====
let A = {}, services = [], step = -1, submitted=false, db=null, sample=null, canSave=false;
try{ const l=JSON.parse(localStorage.getItem("nq_v1")||"null"); if(l){A=l.A||{};services=l.services||[];} }catch(_){}
S.forEach(s=>s.qs.forEach(q=>{ if(q.def && A[q.id]==null) A[q.id]=q.def; }));
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let saveTimer=null;
function queueSave(){
  try{ localStorage.setItem("nq_v1",JSON.stringify({A,services})); }catch(_){}
  $("#saved").textContent="Saving…"; clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,1500);
}
let saving=false, again=false;
async function saveNow(){
  if(!db||!canSave){ $("#saved").textContent="Saved on this device"; return; }
  if(saving){again=true;return;} saving=true;
  try{ await db.doc("questionnaires/nicole").set({answers:A,services,submitted,updatedAt:new Date().toISOString()}); $("#saved").textContent="Saved ✓"; }
  catch(e){ canSave=false; $("#saved").textContent="Saved on this device"; }
  saving=false; if(again){again=false;saveNow();}
}

// ===== Rendering =====
function optLabel(o){ return Array.isArray(o)?o[0]:o; }
function qHTML(q){
  const v=A[q.id];
  if(q.type==="text") return `<div class="q"><div class="t">${esc(q.t)}</div>${q.h?`<div class="h">${esc(q.h)}</div>`:""}<input type="text" data-q="${q.id}" value="${esc(v||"")}" placeholder="${esc(q.ph||"")}"></div>`;
  if(q.type==="textarea") return `<div class="q"><div class="t">${esc(q.t)}</div><div class="h">${q.h?esc(q.h)+" ":""}Tip: tap the 🎤 on your keyboard to talk instead of type.</div><textarea data-q="${q.id}" placeholder="${esc(q.ph||"")}">${esc(v||"")}</textarea></div>`;
  const sel = q.type==="multi" ? (Array.isArray(v?.sel)?v.sel:[]) : (v?.sel?[v.sel]:[]);
  const opts=[...q.o, AI, OTHER];
  return `<div class="q"><div class="t">${esc(q.t)}</div><div class="h">${q.h?esc(q.h)+" ":""}${q.type==="multi"?(q.max?`Pick up to ${q.max}.`:"Pick as many as you like."):"Pick one."}</div>
   <div class="chips">${opts.map(o=>{const L=optLabel(o);const sw=Array.isArray(o)?`<span class="sw" style="background:${o[1]}"></span>`:"";
     return `<button class="chip ${sel.includes(L)?"on":""} ${L===AI?"ai":""}" data-chip="${q.id}" data-val="${esc(L)}">${sw}${esc(L)}</button>`;}).join("")}</div>
   <div class="other ${sel.includes(OTHER)?"on":""}" id="oth-${q.id}"><input type="text" data-other="${q.id}" placeholder="Type your own…" value="${esc(v?.other||"")}"></div></div>`;
}
function vibeHTML(){
  const v=A.vibe?.sel;
  return `<div class="q"><div class="t">Overall vibe</div><div class="h">Pick one — or "You decide".</div><div class="vibes">${VIBES.map(x=>`<button class="vibe ${v===x.k?"on":""}" data-vibe="${esc(x.k)}"><div class="pal">${x.c.map(c=>`<span style="background:${c}"></span>`).join("")}</div><b>${esc(x.k)}</b><small>${esc(x.d)}</small></button>`).join("")}</div>
  <div class="chips" style="margin-top:10px"><button class="chip ai ${v===AI?"on":""}" data-vibe="${AI}">${AI}</button><button class="chip ${v===OTHER?"on":""}" data-vibe="${OTHER}">${OTHER}</button></div>
  <div class="other ${v===OTHER?"on":""}" id="oth-vibe"><input type="text" data-other="vibe" placeholder="Describe the vibe…" value="${esc(A.vibe?.other||"")}"></div></div>`;
}
function servicesHTML(){
  return `<div class="q"><div class="t">Your service menu</div>
   <div class="h">Easiest way: in the GlossGenius app, open your <b>Services</b> list and take screenshots (scroll and take more as needed). Upload them here and Claude will fill in the table. Then just fix anything that's off.</div>
   <input type="file" id="shots" accept="image/*" multiple style="display:none">
   <div class="chips"><button class="b clay" id="shotBtn">📷 Upload screenshots</button><button class="b sec" id="addRow">+ Add a service by hand</button></div>
   <div id="shotMsg" class="h" style="margin-top:8px"></div>
   <div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th style="width:42%">Service</th><th>Price</th><th>Minutes</th><th></th></tr></thead><tbody id="svcBody"></tbody></table></div>
   ${services.length?"":`<div class="h" style="margin-top:6px">No services yet.</div>`}</div>`;
}
function svcRows(){
  const b=$("#svcBody"); if(!b) return;
  b.innerHTML=services.map((s,i)=>`<tr><td><input data-svc="${i}" data-f="name" value="${esc(s.name)}" placeholder="Service"></td><td><input data-svc="${i}" data-f="price" value="${esc(s.price)}" placeholder="$"></td><td><input data-svc="${i}" data-f="minutes" value="${esc(s.minutes)}" inputmode="numeric" placeholder="min"></td><td><button class="x" data-rm="${i}">✕</button></td></tr>`).join("");
}
function ggHTML(){
  return `<div class="note"><b>How to download your client list</b> (needs a computer, not the phone app):<br>1. Log in to GlossGenius in a web browser.<br>2. Go to <b>Clients</b>.<br>3. Tap <b>Export</b> — a CSV file downloads.<br><span style="color:var(--muted)">Client notes and future bookings aren't in that file; GlossGenius support can send those if you ask. Steps reported by other booking apps' help pages — the button name may differ slightly.</span><br>Don't upload that file here — send it to Chris privately.</div>`;
}
function render(){
  window.scrollTo(0,0);
  const scr=$("#screen");
  if(step===-1){ $("#prog").style.display="none"; $("#nav").style.display="none";
    scr.innerHTML=`<p class="lead" style="margin-top:24px">For Nicole 💛</p><h1>Let's design your perfect salon setup</h1>
     <p>Your own beautiful website, easy online booking, payments, and simple money tracking — built around how <i>you</i> work.</p>
     <div class="note">• About 20–30 minutes, ${S.length} short sections<br>• Tap answers — typing is optional<br>• Not sure? Tap <b>"You decide for me"</b> — totally fine<br>• It saves as you go, so you can stop and come back</div>
     <button class="b pri" style="width:100%;margin-top:8px" id="start">${Object.keys(A).length>1?"Continue where I left off":"Let's start"}</button>
     <div class="sec-list" style="margin-top:18px">${S.map((s,i)=>`<button data-jump="${i}"><span>${i+1}. ${esc(s.title)}</span><span class="${secDone(s)?"ok":""}">${secDone(s)?"✓":"›"}</span></button>`).join("")}</div>`;
    return; }
  if(step===S.length){ $("#prog").style.display="block"; $("#barFill").style.width="100%"; $("#secName").textContent="Review";
    $("#nav").style.display="block"; $("#next").textContent=submitted?"Submitted ✓":"Send to Chris"; $("#next").disabled=submitted;
    scr.innerHTML=`<h2>All done — review</h2><p class="lead">Tap a section to change anything.</p>
      <div class="sec-list">${S.map((s,i)=>`<button data-jump="${i}"><span>${esc(s.title)}</span><span class="${secDone(s)?"ok":""}">${secDone(s)?"✓":"Skipped some"}</span></button>`).join("")}</div>
      ${canSave?"":`<div class="note">Your answers are saved on this phone. When you're ready, tap <b>Send to Chris</b> and pick Messages or Mail.</div>`}
      ${canSave?"":`<button class="b clay" style="width:100%;margin-top:10px" id="shareBtn">Send to Chris</button>`}
      <button class="b sec" style="width:100%;margin-top:10px" id="copyBtn">Copy my answers</button>
      <pre id="sum">${esc(summaryText())}</pre>`;
    return; }
  const s=S[step];
  $("#prog").style.display="block"; $("#nav").style.display="block"; $("#next").disabled=false;
  $("#barFill").style.width=((step+1)/(S.length+1)*100)+"%"; $("#secName").textContent=`${step+1} of ${S.length} · ${s.title}`;
  $("#next").textContent= step===S.length-1?"Review":"Next";
  scr.innerHTML=`<h2>${esc(s.title)}</h2><p class="lead">${esc(s.intro)}</p>
    ${s.special==="services"?servicesHTML():""}${s.special==="vibe"?vibeHTML():""}${s.special==="gg"?ggHTML():""}
    ${s.qs.map(qHTML).join("")}`;
  if(s.special==="services") svcRows();
}
function answered(q){ const v=A[q.id]; if(q.type==="text"||q.type==="textarea") return !!(v&&String(v).trim()); return q.type==="multi"? (v?.sel?.length>0) : !!v?.sel; }
function secDone(s){ return s.qs.every(answered) && (s.special!=="vibe"||!!A.vibe?.sel); }
function fmtAns(q){ const v=A[q.id]; if(q.type==="text"||q.type==="textarea") return v||"—";
  const sel=q.type==="multi"?(v?.sel||[]):(v?.sel?[v.sel]:[]); if(!sel.length) return "—";
  return sel.map(x=>x===OTHER?("Other: "+(v.other||"")):x).join(", "); }
function summaryText(){
  let out="NICOLE — SALON SETUP ANSWERS\n";
  S.forEach(s=>{ out+=`\n== ${s.title.toUpperCase()} ==\n`;
    if(s.special==="vibe"){ const v=A.vibe; out+=`Overall vibe: ${v?.sel===OTHER?"Other: "+(v.other||""):(v?.sel||"—")}\n`; }
    if(s.special==="services"){ out+=`Services:\n${services.length?services.map(x=>` - ${x.name} | ${x.price} | ${x.minutes} min`).join("\n"):" (none entered)"}\n`; }
    s.qs.forEach(q=>{ out+=`${q.t}: ${fmtAns(q)}\n`; }); });
  return out;
}

// ===== Events =====
document.addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="start"){ step=0; render(); return; }
  if(t.dataset.jump!=null){ step=+t.dataset.jump; render(); return; }
  if(t.id==="next" && step===S.length && !canSave){ $("#shareBtn")?.click(); return; }
  if(t.id==="back"){ step=Math.max(-1,step-1); render(); return; }
  if(t.id==="next"){ if(step===S.length){ submitted=true; await saveNow(); render(); $("#screen").insertAdjacentHTML("afterbegin",`<div class="note"><b>Thank you!</b> ${canSave?"Your answers are saved for Chris.":"Copy your answers and text them to Chris."}</div>`); return; } step++; render(); return; }
  if(t.dataset.chip){ const q=S.flatMap(s=>s.qs).find(x=>x.id===t.dataset.chip); const val=t.dataset.val;
    let v=A[q.id]||{}; if(q.type==="multi"){ let sel=[...(v.sel||[])];
      if(val===AI) sel = sel.includes(AI)?[]:[AI]; else { sel=sel.filter(x=>x!==AI); sel = sel.includes(val)?sel.filter(x=>x!==val):[...sel,val]; if(q.max && sel.filter(x=>x!==OTHER).length>q.max){ sel=sel.slice(1);} }
      v={...v,sel}; } else { v={...v,sel: v.sel===val?null:val}; }
    A[q.id]=v; queueSave();
    t.parentElement.querySelectorAll(".chip").forEach(c=>{ const on = q.type==="multi" ? (v.sel||[]).includes(c.dataset.val) : v.sel===c.dataset.val; c.classList.toggle("on",on); });
    const o=$("#oth-"+q.id); const showO = q.type==="multi"?(v.sel||[]).includes(OTHER):v.sel===OTHER; o.classList.toggle("on",showO); if(showO) o.querySelector("input").focus();
    return; }
  if(t.dataset.vibe){ const val=t.dataset.vibe; A.vibe={...(A.vibe||{}),sel:A.vibe?.sel===val?null:val}; queueSave(); const keep=window.scrollY; render(); window.scrollTo(0,keep); return; }
  if(t.id==="addRow"){ services.push({name:"",price:"",minutes:""}); queueSave(); svcRows(); return; }
  if(t.dataset.rm!=null){ services.splice(+t.dataset.rm,1); queueSave(); svcRows(); return; }
  if(t.id==="shotBtn"){ $("#shots").click(); return; }
  if(t.id==="shareBtn"){ const text=summaryText();
    if(navigator.share){ try{ await navigator.share({title:"Nicole's salon setup answers",text}); t.textContent="Sent ✓"; return; }catch(err){ if(err&&err.name==="AbortError") return; } }
    try{ await navigator.clipboard.writeText(text); t.textContent="Copied — paste it into a text to Chris"; }catch(_){ t.textContent="Press and hold the text below to copy it"; } return; }
  if(t.id==="copyBtn"){ try{ await navigator.clipboard.writeText(summaryText()); t.textContent="Copied ✓ — paste into a text to Chris"; }catch(_){ t.textContent="Couldn't copy — press and hold the text below to copy"; } return; }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.q){ A[el.dataset.q]=el.value; queueSave(); }
  else if(el.dataset.other){ A[el.dataset.other]={...(A[el.dataset.other]||{}),other:el.value}; queueSave(); }
  else if(el.dataset.svc!=null){ services[+el.dataset.svc][el.dataset.f]=el.value; queueSave(); }
});
document.addEventListener("change",async e=>{
  if(e.target.id!=="shots") return;
  const files=[...e.target.files]; e.target.value=""; if(!files.length) return;
  const msg=$("#shotMsg");
  if(!sample){ msg.textContent="Screenshot reading only works inside Claude. Easiest: text those screenshots to Chris and Claude will read them later — or add services by hand below."; return; }
  let lim=null; try{ lim=await sample.limits(); }catch(_){}
  if(lim && !lim.images){ msg.textContent="Reading images isn't available here — add services by hand."; return; }
  msg.textContent=`Reading ${files.length} screenshot${files.length>1?"s":""}… (about 20–40 seconds)`;
  try{
    const res=await sample(`These are screenshots of a hair stylist's service menu from the GlossGenius app. Extract every service you can see. Return ONLY a JSON array like [{"name":"Women's Haircut","price":"$65","minutes":"60"}]. Keep the price text as shown (e.g. "$85+" or "$120–150"). minutes = duration in minutes as a number string, or "" if not shown. Don't invent services or prices. If the same service appears twice across screenshots, list it once.`,{images:files,cache:false,modelTier:"default"});
    const m=res.text.match(/\[[\s\S]*\]/); const arr=m?JSON.parse(m[0]):[];
    let added=0; arr.forEach(x=>{ if(!x||!x.name) return; if(services.some(s=>s.name.trim().toLowerCase()===String(x.name).trim().toLowerCase())) return; services.push({name:String(x.name),price:String(x.price||""),minutes:String(x.minutes||"")}); added++; });
    queueSave(); svcRows(); msg.textContent = added?`Added ${added} service${added>1?"s":""}. Please check prices and times — fix anything that's off.`:"Couldn't find services in those images. Try clearer screenshots of the Services list.";
  }catch(err){ msg.textContent = err?.code==="not_granted"?"Image reading wasn't allowed — add services by hand.": err?.code==="rate_limited"?"Too many tries right now — wait a minute and try again.":"Couldn't read those — try again or add by hand."; }
});

render();

// ===== Boot capabilities =====
(async()=>{
  const c=window.claude; if(!c||!c.use){ $("#saved").textContent="Saved on this device"; return; }
  db=await c.use("db"); sample=await c.use("sample");
  if(db){ try{ const snap=await db.doc("questionnaires/nicole").get(); canSave=true;
      if(snap.exists){ const d=snap.data(); if(d.updatedAt && Object.keys(A).length<=1){ A=d.answers||A; services=d.services||[]; } submitted=!!d.submitted; render(); }
    }catch(_){ canSave=false; } }
})();
</script>
</body>
</html>
